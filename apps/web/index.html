<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humb</title>
    <script>
      // Dark is the default theme (docs/references/design-system.md) - applied before paint,
      // ahead of React mounting, to avoid a flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem("humb-theme");
        if (stored !== "light") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
