<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qyre</title>
    <script>
      // Apply the theme before React mounts to avoid a flash.
      (function () {
        var stored = localStorage.getItem("qyre-theme");
        if (stored !== "light") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      /* Keep the boot state styled before the app CSS loads. */
      .qyre-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f6f8;
      }
      html.dark .qyre-boot {
        background: #0a0d12;
      }
      .qyre-boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #64748b;
        border-top-color: transparent;
        border-radius: 50%;
        animation: qyre-spin 0.7s linear infinite;
      }
      html.dark .qyre-boot-spinner {
        border-color: #5a6880;
        border-top-color: transparent;
      }
      @keyframes qyre-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="qyre-boot" aria-hidden="true"><div class="qyre-boot-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
